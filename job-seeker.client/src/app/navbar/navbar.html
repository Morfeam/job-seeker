<nav class="navbar navbar-expand-lg sticky-top bg-body-tertiary" [class.shadow-sm]="isScrolled">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">Matt's Job Seeker</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/about" routerLinkActive="active">About</a>
        </li>
        @if (isLoggedIn | async) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" style="cursor:pointer" (click)="logout()" routerLink="/">Log Out</a>
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/sign-in" routerLinkActive="active">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn btn-primary text-white px-3 ms-1" routerLink="/sign-up">Sign Up</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
