<div class="form-control d-flex flex-wrap align-items-center gap-1" style="min-height: 2.5rem;" [class.bg-light]="disabled">
  @for (chip of chips; track chip; let i = $index) {
    <span class="badge bg-secondary d-inline-flex align-items-center">
      {{ chip }}
      <button
        type="button"
        class="btn-close btn-close-white ms-2"
        style="font-size: 0.55rem;"
        [disabled]="disabled"
        (click)="removeChip(i)"
        aria-label="Remove"
      ></button>
    </span>
  }
  <input
    type="text"
    class="border-0 flex-grow-1"
    style="outline: none; min-width: 8rem;"
    [placeholder]="atMax ? 'Limit reached' : placeholder"
    [value]="draft"
    [disabled]="disabled || atMax"
    (input)="draft = $any($event.target).value"
    (keydown)="onKeydown($event)"
    (blur)="commitDraft()"
  />
</div>
